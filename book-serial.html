      text-align: center;

      font-weight: 600;

      border: 2px solid transparent;
      transition: all 0.15s;

    .serial-item.available { 
      background: #dcfce7;

    }

<script>

// ============================================================
// গ্লোবাল ভেরিয়েবল
// ============================================================
let currentUser = sessionStorage.getItem('userPhone') || sessionStorage.getItem('loggedInUser') || null;
let gridRanges = {};
let bookingGridSystem = null;

// ============================================================
// হেল্পার ফাংশন
// ============================================================
function formatDate(date) {
  return date.toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });
}

function getNextDateByDay(targetDay) {
  const daysMap = {
    "Sunday": 0, "Monday": 1, "Tuesday": 2, "Wednesday": 3,
    "Thursday": 4, "Friday": 5, "Saturday": 6
  };
  
  const targetDayIndex = daysMap[targetDay];
  const today = new Date();
  const todayIndex = today.getDay();
  let daysToAdd = targetDayIndex - todayIndex;
  if (daysToAdd < 0) daysToAdd += 7;
  
  const nextDate = new Date(today);
  nextDate.setDate(today.getDate() + daysToAdd);
  
  const year = nextDate.getFullYear();
  const month = String(nextDate.getMonth() + 1).padStart(2, '0');
  const day = String(nextDate.getDate()).padStart(2, '0');
  
  const banglaMonths = ['জানুয়ারী', 'ফেব্রুয়ারী', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',
    'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
  const banglaDays = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
  const banglaDate = `${banglaDays[nextDate.getDay()]}, ${nextDate.getDate()} ${banglaMonths[nextDate.getMonth()]} ${year}`;
  
  return {
    date: nextDate,
    dateString: `${year}-${month}-${day}`,
    displayDate: nextDate.toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
    banglaDate: banglaDate,
    isToday: daysToAdd === 0
  };
}

// ============================================================
// লোড সিরিয়াল রেঞ্জ
// ============================================================
async function loadRanges() {
  try {
    const doc = await db.collection('settings').doc('serialRanges').get();
    if (doc.exists) {
      gridRanges = doc.data();
      if (!gridRanges.Thursday) gridRanges.Thursday = { new: {}, old: {} };
      if (!gridRanges.Friday) gridRanges.Friday = { new: {}, old: {} };
    } else {
      gridRanges = { Thursday: { new: {}, old: {} }, Friday: { new: {}, old: {} } };
    }
    console.log('✅ সিরিয়াল রেঞ্জ লোড হয়েছে:', gridRanges);
  } catch (e) { 
    console.error('Ranges error:', e); 
  }
}

// ============================================================
// টাইম অপশন আপডেট - AM/PM ফরম্যাট সহ
// ============================================================
function updateBookingTimeOptions() {
  const day = document.getElementById('bookDay').value;
  const type = document.getElementById('bookType').value;
  const timeSelect = document.getElementById('bookTime');
  
  timeSelect.innerHTML = '<option value="">-- সময় নির্বাচন করুন --</option>';
  
  if (!day || !type) {
    timeSelect.innerHTML = '<option value="">প্রথমে দিন ও ধরন নির্বাচন করুন</option>';
    return;
  }
  
  if (gridRanges[day] && gridRanges[day][type]) {
    // 🔥 সময়গুলো সাজানোর জন্য Array
    const times = Object.keys(gridRanges[day][type]);
    
    // ✅ সঠিকভাবে সাজান (ঘন্টা অনুযায়ী)
    times.sort((a, b) => {
      return convertTimeToMinutes(a) - convertTimeToMinutes(b);
    });
    
    times.forEach(time => {
      const option = document.createElement('option');
      option.value = time;
      // 🔥 AM/PM ফরম্যাটে দেখান
      option.textContent = formatTimeAMPM(time);
      timeSelect.appendChild(option);
    });
  }
  
  if (timeSelect.options.length <= 1) {
    timeSelect.innerHTML = '<option value="">-- কোনো সময় নেই --</option>';
  }
}

// ============================================================
// সময়কে মিনিটে কনভার্ট করার ফাংশন (সাজানোর জন্য)
// ============================================================
function convertTimeToMinutes(timeStr) {
  if (!timeStr) return 0;
  // "10:00 AM" বা "10:00" বা "10:00 am" সব ফরম্যাট সাপোর্ট
  let cleaned = timeStr.trim().toUpperCase();
  let hours = 0, minutes = 0;
  let isPM = cleaned.includes('PM');
  
  // শুধু সংখ্যা বের করা
  const parts = cleaned.match(/(\d+):?(\d+)?/);
  if (parts) {
    hours = parseInt(parts[1]);
    minutes = parseInt(parts[2] || 0);
  }
  
  // ১২ ঘন্টা ফরম্যাট কনভার্ট
  if (isPM && hours < 12) hours += 12;
  if (!isPM && hours === 12) hours = 0;
  
  return hours * 60 + minutes;
}

// ============================================================
// সময়কে AM/PM ফরম্যাটে দেখানোর ফাংশন
// ============================================================
function formatTimeAMPM(timeStr) {
  if (!timeStr) return timeStr;
  
  let cleaned = timeStr.trim().toUpperCase();
  // ইতিমধ্যে AM/PM থাকলে সেটাই রিটার্ন
  if (cleaned.includes('AM') || cleaned.includes('PM')) {
    return timeStr;
  }
  
  // শুধু সংখ্যা বের করা
  const parts = cleaned.match(/(\d+):?(\d+)?/);
  if (!parts) return timeStr;
  
  let hours = parseInt(parts[1]);
  let minutes = parseInt(parts[2] || 0);
  let ampm = hours >= 12 ? 'PM' : 'AM';
  
  // ১২ ঘন্টা ফরম্যাটে কনভার্ট
  let displayHour = hours % 12;
  if (displayHour === 0) displayHour = 12;
  
  const minStr = minutes.toString().padStart(2, '0');
  return `${displayHour}:${minStr} ${ampm}`;
}

// ============================================================
// বুকিং গ্রিড সিস্টেম ইনিশিয়ালাইজ
// ============================================================
function initializeBookingGridSystem() {
  if (bookingGridSystem) {
    bookingGridSystem.cleanup();
    bookingGridSystem = null;
  }

  bookingGridSystem = new RealTimeGridSystem({
    db: db,
    gridContainerId: 'serialGrid',
    selectedSerialInputId: 'selectedSerial',
    dayElementId: 'bookDay',
    timeElementId: 'bookTime',
    typeElementId: 'bookType',
    mode: 'user',
    userPendingExpiry: 1 * 60 * 1000,
    
    onSerialClick: function(data) {
      console.log('✅ সিরিয়াল সিলেক্টেড:', data);
      const btn = document.getElementById('confirmBookBtn');
      if (data.status === 'selected' || data.status === 'pending') {
        document.getElementById('selectedSerial').value = data.serial;
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
      } else {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
    },
    
    onGridUpdate: function(type, data) {
      console.log('📊 গ্রিড আপডেট হয়েছে:', type, data);
      // গ্রিড আপডেট হলে কনফর্ম বাটন ডিসেবল করুন
      const btn = document.getElementById('confirmBookBtn');
      if (!document.getElementById('selectedSerial').value) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
      }
    }
  });
  
  return bookingGridSystem.init().then(success => {
    if (success) {
      console.log('✅ বুকিং গ্রিড সিস্টেম রেডি');
      return true;
    }
    return false;
  });
}

// ============================================================
// গ্রিড রিফ্রেশ (ডে/টাইপ/টাইম চেঞ্জ হলে)
// ============================================================
function refreshBookingGrid() {
  const day = document.getElementById('bookDay').value;
  const type = document.getElementById('bookType').value;
  const time = document.getElementById('bookTime').value;
  
  const gridContainer = document.getElementById('serialGrid');
  const btn = document.getElementById('confirmBookBtn');
  
  // বাটন ডিসেবল করুন
  btn.disabled = true;
  btn.style.opacity = '0.5';
  btn.style.cursor = 'not-allowed';
  document.getElementById('selectedSerial').value = '';
  
  // গ্রিড ক্লিয়ার করুন
  if (gridContainer) {
    if (!day || !type || !time) {
      let msg = 'দিন, ধরন এবং সময় নির্বাচন করুন';
      if (day && type && !time) msg = 'সময় নির্বাচন করুন';
      else if (day && !type) msg = 'ধরন নির্বাচন করুন';
      else if (!day) msg = 'দিন নির্বাচন করুন';
      
      gridContainer.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:20px;color:#94a3b8;">
          ${msg}
        </div>
      `;
      return;
    }
  }
  
  // Grid System আপডেট
  if (bookingGridSystem) {
    bookingGridSystem.updateGrid();
  }
}

// ============================================================
// সিরিয়াল বুকিং কনফার্ম
// ============================================================
async function confirmBooking() {
  // ১. সিরিয়াল ভ্যালিডেশন
  let serial = document.getElementById('selectedSerial').value;
  if (serial && serial.startsWith('[')) {
    try {
      const serials = JSON.parse(serial);
      serial = serials[0] || null;
    } catch(e) { serial = null; }
  }
  serial = parseInt(serial);
  if (!serial || isNaN(serial)) { 
    Swal.fire({ title: 'সতর্কতা!', text: 'সিরিয়াল নির্বাচন করুন', icon: 'warning' });
    return; 
  }
  
  const day = document.getElementById('bookDay').value;
  const time = document.getElementById('bookTime').value;
  const type = document.getElementById('bookType').value;
  
  if (!day || !time || !type) { 
    Swal.fire({ title: 'সতর্কতা!', text: 'সব তথ্য দিন', icon: 'warning' });
    return; 
  }

  const nextDateInfo = getNextDateByDay(day);
  const typeText = type === 'new' ? 'নতুন রোগী' : 'পুরাতন রোগী';
  
  // কনফার্মেশন পপআপ
 const confirmResult = await Swal.fire({
 title: 'সিরিয়াল বুকিং কনফার্ম',
 html: `
 <div style="text-align:left;padding:10px;">
 <p><strong>📅 তারিখ:</strong> ${nextDateInfo.banglaDate}</p>
 <p><strong>⏰ সময়:</strong> ${time}</p>
 <p><strong>🔢 সিরিয়াল:</strong> #${serial}</p>
 <p><strong>👤 ধরন:</strong> ${typeText}</p>
 </div>
 `,
icon: 'question',
 showCancelButton: true,
 confirmButtonColor: '#3b82f6',
 cancelButtonColor: '#64748b',
 confirmButtonText: '✅ হ্যাঁ, বুক করুন',
 cancelButtonText: '❌ বাতিল'
 });

if (!confirmResult.isConfirmed) return;

  try {
    // ইউজার ডেটা লোড
    const userDoc = await db.collection('users').doc(currentUser).get();
    const userData = userDoc.exists ? userDoc.data() : {};
    
    // নতুন সিস্টেম অনুযায়ী আইডি তৈরি (yymmdd-serial)
    const yymmdd = nextDateInfo.dateString.replace(/-/g, '').slice(2);
    const formattedSerial = String(serial).padStart(2, '0');
    const customId = `${yymmdd}-${formattedSerial}`;

    // ২. ডুপ্লিকেট চেক (সরাসরি ডক আইডি দিয়ে চেক করা অনেক দ্রুত)
    const docRef = db.collection('appointments').doc(customId);
    const duplicateCheck = await docRef.get();
    
    if (duplicateCheck.exists) {
      Swal.fire({ title: 'দুঃখিত!', text: 'এই সিরিয়ালটি ইতিমধ্যে বুক হয়ে গেছে।', icon: 'error' });
      if (bookingGridSystem) bookingGridSystem.updateGrid();
      return;
    }

    // ৩. নতুন সিস্টেমের ডেটা ফরম্যাট
    const appointmentData = {
      appointmentId: customId,
      name: userData.name || 'রোগী',
      phone: currentUser,
      age: userData.age || '',
      serial: serial,
      day: day,
      time: time,
      timeSlot: time,
      patientType: type,
      status: 'confirmed',
      appointmentDate: nextDateInfo.dateString,
      appointmentDateDisplay: nextDateInfo.banglaDate,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    // ৪. ডেটা সেট করা
    await docRef.set(appointmentData);

    // ৫. সাকসেস এবং রিসেট
    document.getElementById('selectedSerial').value = '';
    
    Swal.fire({ title: '✅ সফল!', text: `সিরিয়াল ${serial} বুক করা হয়েছে!`, icon: 'success', timer: 2000 });

    if (bookingGridSystem) {
      bookingGridSystem.currentSelection = null;
      bookingGridSystem.updateGrid();
    }
    
  } catch (e) {
    console.error('❌ বুকিং এরর:', e);
    Swal.fire({ title: 'সমস্যা!', text: 'বুকিং করতে সমস্যা হয়েছে: ' + e.message, icon: 'error' });
  }
}

// ============================================================
// সাইডবার স্ট্যাট আপডেট - components-inline.js এর ফাংশন ব্যবহার
// ============================================================
function updateSidebarStats() {
  // components-inline.js এর window.updateSidebarStats ফাংশন কল
  if (typeof window.updateSidebarStats === 'function') {
    // ফাংশনটি components-inline.js এ ডিফাইন করা আছে
    // এটি sideTotal এবং sidePending আপডেট করবে
    window.updateSidebarStats(0, 0);
  }
}

// ============================================================
// কম্পোনেন্ট লোডার রেডি হওয়ার জন্য অপেক্ষা
// ============================================================
function waitForComponentLoader(callback, retries = 15) {
  if (typeof ComponentLoader !== 'undefined' && ComponentLoader.loadAllComponents) {
    callback();
    return;
  }
  if (retries <= 0) {
    console.warn('⚠️ ComponentLoader পাওয়া যায়নি, ডিফল্ট UI লোড হচ্ছে');
    return;
  }
  setTimeout(() => waitForComponentLoader(callback, retries - 1), 300);
}

// ============================================================
// DOM লোড হলে
// ============================================================
document.addEventListener('DOMContentLoaded', async function() {
  // সেশন চেক
  if (!currentUser) {
    currentUser = sessionStorage.getItem('userPhone') || sessionStorage.getItem('loggedInUser');
    if (!currentUser) {
      window.location.href = 'login.html';
      return;
    }
  }

  // হেডার ডেট
  const now = new Date();
  document.getElementById('headerDate').textContent = formatDate(now);

  // কম্পোনেন্ট লোড
  waitForComponentLoader(() => {
    ComponentLoader.loadAllComponents('সিরিয়াল বুকিং');
    console.log('✅ কম্পোনেন্ট লোড সম্পন্ন');
  });

  // ===== ইভেন্ট লিসেনার =====
  
  // দিন পরিবর্তন
  document.getElementById('bookDay').addEventListener('change', function() {
    updateBookingTimeOptions();
    document.getElementById('selectedSerial').value = '';
    const gridContainer = document.getElementById('serialGrid');
    if (gridContainer) {
      gridContainer.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:20px;color:#94a3b8;">
          সময় নির্বাচন করুন...
        </div>
      `;
    }
    setTimeout(refreshBookingGrid, 100);
  });

  // ধরন পরিবর্তন
  document.getElementById('bookType').addEventListener('change', function() {
    updateBookingTimeOptions();
    document.getElementById('selectedSerial').value = '';
    const gridContainer = document.getElementById('serialGrid');
    if (gridContainer) {
      gridContainer.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:20px;color:#94a3b8;">
          ${document.getElementById('bookDay').value ? 'সময় নির্বাচন করুন...' : 'দিন নির্বাচন করুন...'}
        </div>
      `;
    }
    setTimeout(refreshBookingGrid, 100);
  });

  // সময় পরিবর্তন
  document.getElementById('bookTime').addEventListener('change', function() {
    document.getElementById('selectedSerial').value = '';
    const btn = document.getElementById('confirmBookBtn');
    btn.disabled = true;
    btn.style.opacity = '0.5';
    btn.style.cursor = 'not-allowed';
    refreshBookingGrid();
  });

  // কনফর্ম বুকিং বাটন
  document.getElementById('confirmBookBtn').addEventListener('click', confirmBooking);

  // ===== ডাটা লোড =====
  await loadRanges();
  updateBookingTimeOptions();
  
  // গ্রিড সিস্টেম ইনিশিয়ালাইজ
  await initializeBookingGridSystem();
  
  // প্রাথমিক গ্রিড অবস্থা
  const gridContainer = document.getElementById('serialGrid');
  if (gridContainer && !gridContainer.querySelector('.serial-item')) {
    gridContainer.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:20px;color:#94a3b8;">
        দিন, ধরন এবং সময় নির্বাচন করুন
      </div>
    `;
  }
});

// ============================================================
// ক্লিনআপ
// ============================================================
window.addEventListener('beforeunload', function() {
  if (bookingGridSystem) {
    bookingGridSystem.cleanup();
    bookingGridSystem = null;
  }
});
</script>
